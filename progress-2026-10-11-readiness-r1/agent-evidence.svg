<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Gemma: from activity to an evaluated patch</title><desc id="desc">Operational completion and effective agent behavior need separate evidence. No private task identities or prompt/source artifacts are included here.
Conceptual diagram only; it is not an executed benchmark or official branding.</desc>
<rect width="1200" height="520" rx="24" fill="#f7f8fc"/>
<text x="44" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#17243b">Gemma: from activity to an evaluated patch</text>
<text x="44" y="91" font-family="sans-serif" font-size="18" fill="#43546d">Operational completion and effective agent behavior need separate evidence.</text>
<rect x="44" y="130" width="352" height="270" rx="18" fill="#e3f4e9" stroke="#c9d3e0"/>
<text x="66" y="172" font-family="sans-serif" font-size="23" font-weight="700" fill="#17243b">Observed run</text>
<text x="66" y="209" font-family="sans-serif" font-size="18" fill="#263e5a">Version 26: stop acknowledged</text>
<text x="66" y="238" font-family="sans-serif" font-size="18" fill="#263e5a">Budget review; identity kept</text>
<text x="66" y="267" font-family="sans-serif" font-size="18" fill="#263e5a">Trace review found no edit</text>
<text x="66" y="296" font-family="sans-serif" font-size="18" fill="#263e5a">No new official result</text>
<line x1="66" x2="374" y1="332" y2="332" stroke="#9aacc5"/>
<text x="66" y="363" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">A stopped run is an outcome</text>
<text x="66" y="387" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">rather than an effective patch.</text>
<rect x="416" y="130" width="352" height="270" rx="18" fill="#e6eefc" stroke="#c9d3e0"/>
<text x="438" y="172" font-family="sans-serif" font-size="23" font-weight="700" fill="#17243b">Original hypothesis</text>
<text x="438" y="209" font-family="sans-serif" font-size="18" fill="#263e5a">E02: proposed, unexecuted</text>
<text x="438" y="238" font-family="sans-serif" font-size="18" fill="#263e5a">Inspect relevant source</text>
<text x="438" y="267" font-family="sans-serif" font-size="18" fill="#263e5a">Make one bounded edit</text>
<text x="438" y="296" font-family="sans-serif" font-size="18" fill="#263e5a">Test and inspect the diff</text>
<line x1="438" x2="746" y1="332" y2="332" stroke="#9aacc5"/>
<text x="438" y="363" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">The generic cycle is a proposal.</text>
<text x="438" y="387" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">No effectiveness claim yet.</text>
<rect x="788" y="130" width="352" height="270" rx="18" fill="#f5e9fb" stroke="#c9d3e0"/>
<text x="810" y="172" font-family="sans-serif" font-size="23" font-weight="700" fill="#17243b">Required evidence</text>
<text x="810" y="209" font-family="sans-serif" font-size="18" fill="#263e5a">Healthy runtime boundary</text>
<text x="810" y="238" font-family="sans-serif" font-size="18" fill="#263e5a">Actual source-changing action</text>
<text x="810" y="267" font-family="sans-serif" font-size="18" fill="#263e5a">Focused verification</text>
<text x="810" y="296" font-family="sans-serif" font-size="18" fill="#263e5a">Separate scored evaluation</text>
<line x1="810" x2="1118" y1="332" y2="332" stroke="#9aacc5"/>
<text x="810" y="363" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">Runtime/tool success alone</text>
<text x="810" y="387" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">does not establish task success.</text>
<text x="44" y="449" font-family="sans-serif" font-size="18" fill="#43546d">No private task identities or prompt/source artifacts are included here.</text>
<text x="44" y="476" font-family="sans-serif" font-size="18" fill="#43546d">Conceptual diagram only; it is not an executed benchmark or official branding.</text>
</svg>
