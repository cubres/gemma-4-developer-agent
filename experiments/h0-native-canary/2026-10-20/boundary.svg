<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310"><rect width="1100" height="310" rx="20" fill="#101c30"/><text x="32" y="42" fill="#f1f5ff" font-family="sans-serif" font-size="23" font-weight="700">H0 V34: where the evidence stops</text><text x="32" y="70" fill="#bdcce6" font-family="sans-serif" font-size="15">Source-derived gates are separate from measured model success.</text><g font-family="sans-serif"><rect x="32" y="105" width="305" height="125" rx="13" fill="#153f4b" stroke="#5dd8c6"/><text x="51" y="135" fill="#8bf2dd" font-size="16" font-weight="700">PASSED IN CONTROL FLOW</text><text x="51" y="164" fill="#edf8ff" font-size="16">Kit hashes and containment</text><text x="51" y="188" fill="#edf8ff" font-size="16">Certificate and core admission</text><text x="51" y="212" fill="#edf8ff" font-size="16">Bounded export reached</text><path d="M351 168h42" stroke="#bed0ef" stroke-width="3"/><path d="m384 162 10 6-10 6" fill="none" stroke="#bed0ef" stroke-width="3"/><rect x="409" y="105" width="305" height="125" rx="13" fill="#443b2b" stroke="#e9bd72"/><text x="428" y="135" fill="#ffda9e" font-size="16" font-weight="700">UNQUALIFIED STAGE</text><text x="428" y="164" fill="#fff6e5" font-size="16">Runtime, model, server, compiler</text><text x="428" y="188" fill="#fff6e5" font-size="16">Call count and core cleanup</text><text x="428" y="212" fill="#fff6e5" font-size="16">Failure cause remains unknown</text><path d="M728 168h42" stroke="#bed0ef" stroke-width="3"/><path d="m761 162 10 6-10 6" fill="none" stroke="#bed0ef" stroke-width="3"/><rect x="786" y="105" width="282" height="125" rx="13" fill="#422d40" stroke="#e3a0bb"/><text x="805" y="136" fill="#ffd0df" font-size="17" font-weight="700">HOLD_H0_FAILED</text><text x="805" y="166" fill="#fff0f6" font-size="16">ERROR after 20.4 seconds</text><text x="805" y="191" fill="#fff0f6" font-size="16">453-byte public receipt</text><text x="805" y="216" fill="#fff0f6" font-size="16">No submission or new score</text><text x="32" y="276" fill="#bdcce6" font-size="15">A false verification flag means unverified. It does not establish that zero calls occurred.</text></g></svg>