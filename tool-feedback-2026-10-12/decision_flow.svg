<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
<title id="title">Recover from a bad tool call</title><desc id="desc">An original advisor checks exact tool arguments before execution and actual command outcomes after execution. Two failed checks trigger reassessment. Native correctness and score remain separate.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#6f91b8"/></marker></defs>
<rect width="1040" height="560" rx="20" fill="#0c1625"/>
<g font-family="Arial,sans-serif" fill="#e9f2ff"><text x="42" y="48" font-size="27" font-weight="700">Recover before a check becomes the whole task</text><text x="42" y="76" font-size="15" fill="#b5c9e3">Failure-informed policy • original CPU-tested advisor • native integration still untested</text></g>
<g stroke="#45658d" stroke-width="2" fill="#162a43"><rect x="42" y="115" width="275" height="116" rx="12"/><rect x="381" y="115" width="275" height="116" rx="12"/><rect x="720" y="115" width="275" height="116" rx="12"/><rect x="42" y="315" width="275" height="130" rx="12"/><rect x="381" y="315" width="275" height="130" rx="12"/><rect x="720" y="315" width="275" height="130" rx="12"/></g>
<g font-family="Arial,sans-serif" fill="#e9f2ff" font-size="17"><text x="62" y="145" font-weight="700">Proposed tool call</text><text x="62" y="174">Reviewed contract + time</text><text x="62" y="201" fill="#b5c9e3">Arguments stay unchanged</text><text x="401" y="145" font-weight="700">Exact preflight</text><text x="401" y="174">Keys • types • range • path</text><text x="401" y="201" fill="#b5c9e3">Mismatch → precise feedback</text><text x="740" y="145" font-weight="700">Native tool boundary</text><text x="740" y="174">Caller decides and executes</text><text x="740" y="201" fill="#b5c9e3">Accounting stays authoritative</text><text x="62" y="346" font-weight="700">Reassess or finish</text><text x="62" y="376">No third check-program repair</text><text x="62" y="404" fill="#b5c9e3">Report validation limits honestly</text><text x="401" y="346" font-weight="700">Bounded recovery</text><text x="401" y="376">One attempt + one short repair</text><text x="401" y="404" fill="#b5c9e3">Two failures → reassessment</text><text x="740" y="346" font-weight="700">Actual command outcome</text><text x="740" y="376">Nested exit + real error fields</text><text x="740" y="404" fill="#b5c9e3">Absent exit remains unknown</text></g>
<g stroke="#6f91b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M319 170 H375"/><path d="M658 170 H714"/><path d="M859 233 V307"/><path d="M718 380 H664"/><path d="M379 380 H325"/></g>
<text x="42" y="496" font-family="Arial,sans-serif" font-size="16" fill="#aac4e4">Zero exit is command evidence. A correct source repair still needs independent native verification.</text><text x="42" y="526" font-family="Arial,sans-serif" font-size="14" fill="#aac4e4">No task content, private metrics or leaderboard claim is included. This diagram does not measure saved time.</text></svg>
