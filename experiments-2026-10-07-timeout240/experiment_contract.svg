<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
<title id="title">A_scout: one timeout field, two execution boundaries</title>
<desc id="desc">Original contract illustration. Scout and engineer, five-minute budget, tool and turn caps and prompts stay fixed. Command timeout changes from 90 to 240 seconds, capped by remaining task time with the existing five-second floor. Final pytest uses the configured timeout separately and still needs passing JUnit. The accepted submission was pending in the recorded snapshot; no score improvement is claimed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52657b"/></marker></defs>
