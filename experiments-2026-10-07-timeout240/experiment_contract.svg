<text x="78" y="216" font-size="31" font-weight="700" fill="white">timeout_seconds: 90 → 240</text>
<text x="699" y="179" font-size="19" fill="white">Unchanged: 5-minute task · 100 calls · 160 turns</text>
<text x="699" y="215" font-size="19" fill="white">Same model, prompts, sampling and scout</text>
